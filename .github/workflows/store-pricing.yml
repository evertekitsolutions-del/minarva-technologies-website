name: Store quote rules
on:
  pull_request:
    paths:
      - 'store/lib/**'
      - 'store/tests/**'
      - '.github/workflows/store-pricing.yml'
  push:
    branches: [main]
    paths:
      - 'store/lib/**'
      - 'store/tests/**'
      - '.github/workflows/store-pricing.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test store/tests/*.test.mjs
