name: Store - Manual CRM Edge origin verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-cors:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - name: Validate CORS contract without any network calls
        run: node --test store/tests/crm-edge-origin-readiness.test.mjs
      - name: Probe deployed Edge CORS with OPTIONS only
        run: node store/scripts/check-crm-edge-origin.mjs --live
