name: Store - Medusa runtime smoke
on:
  pull_request:
    paths:
      - 'store/commerce/apps/backend/**'
      - 'store/commerce/SMOKE_VERIFICATION.md'
      - '.github/workflows/store-medusa-runtime-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'store/commerce/apps/backend/**'
      - '.github/workflows/store-medusa-runtime-smoke.yml'
permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa_ci
          POSTGRES_PASSWORD: ci-local-temporary-only
          POSTGRES_DB: minarva_store_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa_ci -d minarva_store_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15

    env:
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: postgresql://medusa_ci:ci-local-temporary-only@127.0.0.1:5432/minarva_store_ci
      REDIS_URL: redis://127.0.0.1:6379
      STORE_CORS: http://127.0.0.1:8000
      ADMIN_CORS: http://127.0.0.1:9000
      AUTH_CORS: http://127.0.0.1:8000,http://127.0.0.1:9000
      JWT_SECRET: ci-a-temporary-test-only-unique-jwt-secret
      COOKIE_SECRET: ci-another-temporary-only-cookie-secret
      STORE_SHIPROCKET_PLUGIN_ENABLED: "false"
      STORE_ALLOW_EXTERNAL_PROVIDER_STAGING: "false"
      STORE_AUTOMATIONS_PLUGIN_ENABLED: "false"
      STORE_AUTOMATIONS_STAGING_APPROVED: "false"
      STORE_PUBLIC_CHECKOUT_TEST_ENABLED: "false"
      STORE_PUBLIC_CHECKOUT_TEST_APPROVED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install Medusa OSS packages (no third-party install scripts)
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm --dir store/commerce install --frozen-lockfile --ignore-scripts
      - name: Run Medusa native DB migrations on disposable CI database
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir store/commerce --filter @dtc/backend exec medusa db:migrate
      - name: Boot actual Medusa backend and verify the health endpoint
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir store/commerce --filter @dtc/backend dev > "$RUNNER_TEMP/medusa-ci.log" 2>&1 &
          backend_pid=$!
          trap 'kill $backend_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:9000/health > "$RUNNER_TEMP/health-response.txt"; then
              echo "Medusa Health endpoint responded successfully"
              cat "$RUNNER_TEMP/health-response.txt"
              # Bypass the Next.js UI and target Medusa's public cart API.
              # Must fail at the actual backend middleware before any order
              # is created, regardless of publishable client checkout logic.
              # Medusa's native Store API requires a publishable key even
              # before custom middleware. Use the throwaway CI default key
              # from Medusa's own isolated database, never a merchant key.
              if ! command -v psql >/dev/null 2>&1; then
                sudo apt-get update -qq
                sudo apt-get install -y postgresql-client
              fi
              publishable_ci=$(psql "$DATABASE_URL" -Atqc \
                "SELECT token FROM api_key WHERE type = 'publishable' AND deleted_at IS NULL LIMIT 1")
              if [[ -z "$publishable_ci" ]]; then
                echo "No disposable Medusa publishable API key available" >&2
                exit 1
              fi
              # A UI toggle is insufficient; prove the real Medusa API
              # refuses unauthorised cart CREATE/ADD/UPDATE/DELETE/COMPLETE.
              # Each response MUST be from our guard, not a route 401/404.
              for method_and_route in \
                "POST /store/carts" \
                "POST /store/carts/cart_ci_never_create/line-items" \
                "PATCH /store/carts/cart_ci_never_create" \
                "DELETE /store/carts/cart_ci_never_create/line-items/item_ci_missing" \
                "POST /store/carts/cart_ci_never_create/complete"; do
                verb="${method_and_route%% *}"
                route="${method_and_route#* }"
                blocked_code=$(curl --silent --show-error --max-time 6 \
                  -o "$RUNNER_TEMP/blocked-order.json" -w '%{http_code}' \
                  -X "$verb" "http://127.0.0.1:9000$route" \
                  -H "x-publishable-api-key: $publishable_ci" \
                  -H 'Content-Type: application/json' -d '{}')
                if [[ "$blocked_code" != "503" ]] || \
                    ! grep -q 'Customer cart and checkout are not yet available' "$RUNNER_TEMP/blocked-order.json"; then
                  echo "Unsafe cart mutation $verb $route bypassed gate (HTTP $blocked_code)" >&2
                  cat "$RUNNER_TEMP/blocked-order.json" >&2
                  tail -n 100 "$RUNNER_TEMP/medusa-ci.log" >&2
                  exit 1
                fi
                echo "Verified denied: $verb $route"
              done
              echo "All five direct Medusa cart mutation routes are blocked before launch"
              exit 0
            fi
            if ! kill -0 $backend_pid 2>/dev/null; then
              echo "Medusa backend exited prematurely" >&2
              tail -n 140 "$RUNNER_TEMP/medusa-ci.log" >&2
              exit 1
            fi
            sleep 3
          done
          echo "Medusa backend health endpoint timed out" >&2
          tail -n 180 "$RUNNER_TEMP/medusa-ci.log" >&2
          exit 1
      - name: Preserve sanitized backend logs on failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/medusa-ci.log" ]; then
            tail -n 80 "$RUNNER_TEMP/medusa-ci.log" |
              sed -E 's#postgresql://[^@]+@#postgresql://[redacted]@#g'
          fi
