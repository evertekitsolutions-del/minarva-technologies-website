name: Store - Cashfree installed SDK contract
on:
  pull_request:
    paths:
      - 'store/commerce/apps/backend/scripts/cashfree-sdk-shape.mjs'
      - '.github/workflows/store-cashfree-sdk-contract.yml'
      - 'store/lib/cashfree-proof.mjs'
      - 'store/commerce/apps/backend/src/modules/cashfree/**'
  push:
    branches: [main]
    paths:
      - 'store/commerce/apps/backend/scripts/cashfree-sdk-shape.mjs'
      - '.github/workflows/store-cashfree-sdk-contract.yml'
      - 'store/commerce/apps/backend/src/modules/cashfree/**'
permissions:
  contents: read
jobs:
  sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install exact open-source SDK dependencies without lifecycle scripts
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          pnpm --dir store/commerce install --frozen-lockfile --ignore-scripts
      - name: Verify real published SDK method shape
        run: pnpm --dir store/commerce --filter @dtc/backend exec node scripts/cashfree-sdk-shape.mjs
      - name: Re-run all store pricing and signed webhook evidence tests
        run: node --test store/tests/*.test.mjs
