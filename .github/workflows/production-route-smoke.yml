name: Production Route Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/production-route-smoke.mjs
