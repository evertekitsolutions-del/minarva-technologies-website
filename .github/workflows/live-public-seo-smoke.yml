name: Live Public Website SEO Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/live-public-seo-smoke.mjs
