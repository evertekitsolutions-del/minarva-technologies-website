name: Store - import MIT automation engine
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/store-import-automation-module.yml'
      - 'store/commerce/AUTOMATION_MODULE.md'
  workflow_dispatch:

concurrency:
  group: store-automation-dependency-import
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import-automation-module:
    if: github.repository == 'evertekitsolutions-del/minarva-technologies-website' && (github.event_name != 'pull_request' || github.head_ref == 'feat/store-006-oss-automation-engine')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-006-oss-automation-engine
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Pin published open-source automation engine to Medusa backend
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          cd store/commerce
          pnpm add --filter @dtc/backend --save-exact '@codee-sh/medusa-plugin-automations@1.0.11' --ignore-scripts
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const backend=JSON.parse(readFileSync('apps/backend/package.json','utf8'))
          assert.equal(backend.dependencies['@codee-sh/medusa-plugin-automations'],'1.0.11')
          assert.equal(backend.dependencies['@medusajs/medusa'],'2.22.0')
          EOF
      - name: Push dependency and lockfile to the review branch only
        shell: bash
        run: |
          set -euo pipefail
          git add store/commerce/apps/backend/package.json store/commerce/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Module already pinned"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'vendor(store): add MIT Medusa automation rule engine 1.0.11'
          git fetch origin feat/store-006-oss-automation-engine
          git rebase origin/feat/store-006-oss-automation-engine
          git push origin HEAD:refs/heads/feat/store-006-oss-automation-engine
