name: Service Pages Integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/service-pages-integrity.mjs
      - run: node tools/field-service-operations-contract.mjs
      - run: node tools/service-sla-contract.mjs
      - run: node tools/service-sla-alerts-contract.mjs
      - run: node tools/service-rpc-boundary-contract.mjs
      - run: node tools/support-enquiry-contract.mjs