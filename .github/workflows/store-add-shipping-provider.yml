name: Store - import ready-made Shiprocket Medusa provider
on:
  push:
    branches: [feat/store-003-offline-staging-and-oss-providers]
    paths:
      - '.github/workflows/store-add-shipping-provider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-oss-provider:
    if: github.repository == 'evertekitsolutions-del/minarva-technologies-website'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-003-offline-staging-and-oss-providers
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Resolve exact open-source provider dependency without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
          cd store/commerce
          pnpm --version
          pnpm add --filter @dtc/backend --save-exact '@sam-ael/medusa-plugin-shiprocket@0.2.1' --ignore-scripts
          node -e "const p=require('./apps/backend/package.json');if(p.dependencies['@sam-ael/medusa-plugin-shiprocket']!=='0.2.1')process.exit(1)"
          grep -q '@sam-ael/medusa-plugin-shiprocket' pnpm-lock.yaml
      - name: Commit dependency + reproducible lockfile on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add store/commerce/apps/backend/package.json store/commerce/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Provider already present'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'vendor(store): lock MIT Shiprocket Medusa provider 0.2.1 (disabled by default)'
          git push origin HEAD:refs/heads/feat/store-003-offline-staging-and-oss-providers
